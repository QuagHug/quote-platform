# DevOps Assignment - Part 3: fixed manifests.
# Every change from broken-app.yaml is marked "FIX n" and explained in
# TROUBLESHOOTING.md. default-deny is kept as is; three least-privilege
# allow policies are added. Nodes are not touched.
---
apiVersion: v1
kind: Namespace
metadata:
  name: troubleshoot
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: troubleshoot
data:
  index.html: |
    <html><body><h1>TROUBLESHOOT-OK</h1></body></html>
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: troubleshoot
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# FIX 9: the smoke client may resolve names, and only through cluster DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smoke-client-allow-dns
  namespace: troubleshoot
spec:
  podSelector:
    matchLabels:
      app: smoke-client
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# FIX 10: the smoke client may open connections to web pods on port 80.
# Policies see the pod port after Service DNAT, not the Service port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smoke-client-allow-web
  namespace: troubleshoot
spec:
  podSelector:
    matchLabels:
      app: smoke-client
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 80
---
# FIX 11: web pods accept port 80 only from the smoke client.
# Kubelet probes need no rule: kube-router always allows the pod's own node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-allow-from-smoke-client
  namespace: troubleshoot
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: smoke-client
      ports:
        - protocol: TCP
          port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: troubleshoot
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.30                  # FIX 5: nginx:1.25.99 does not exist
          ports:
            - name: http                     # FIX 6: named port, probes and Service use it
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 32Mi                   # FIX 1: was 16Gi, no node can fit it
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http                     # FIX 6: was 8080, nginx listens on 80
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http                     # FIX 6
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: web-config                 # FIX 4: was web-conf
---
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  namespace: troubleshoot
spec:
  selector:
    app: web                                 # FIX 7: was webapp, matched no pods
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http                       # FIX 8: was 8080
---
# Simulated AI inference workload. In production this runs on our GPU
# nodepool. It must end up Running on the GPU-labeled node - without
# touching the node's taint or labels.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference
  namespace: troubleshoot
  labels:
    app: ai-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-inference
  template:
    metadata:
      labels:
        app: ai-inference
    spec:
      nodeSelector:
        acme.io/node-type: gpu               # FIX 2: key was node-type
      tolerations:                           # FIX 3: tolerate the GPU taint
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: inference
          image: busybox:1.36
          command: ["sh", "-c", "echo 'inference engine warm'; while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
