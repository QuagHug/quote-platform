# Argo CD for a laptop: only what GitOps for one Helm chart needs.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
configs:
  params:
    server.insecure: true          # plain HTTP behind kubectl port-forward, local only
  cm:
    timeout.reconciliation: 60s    # poll Git every minute so CI tag bumps land fast
    users.anonymous.enabled: "true"
  rbac:
    policy.default: role:readonly  # anonymous visitors can look, not change
