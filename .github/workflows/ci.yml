name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KUBERNETES_VERSION: 1.36.5

jobs:
  test:
    name: Go vet and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  sast:
    name: Semgrep SAST
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep scan (any finding fails the job)
        run: >-
          semgrep scan
          --config p/golang
          --config p/dockerfile
          --config p/secrets
          --config p/github-actions
          --error
          --metrics off

  chart:
    name: Helm lint and kubeconform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: alpine/k8s:1.36.5@sha256:094adf64cdc4827377cdbe7ea5747472ce115f9fbc64a4e35970ec66777f9a00
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: helm lint
        run: helm lint --strict charts/quote-api
      - name: kubeconform on the rendered chart
        run: |
          helm template quote-api charts/quote-api --namespace quote-api \
            --api-versions monitoring.coreos.com/v1 > /tmp/rendered.yaml
          kubeconform -strict -summary \
            -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered.yaml

  changes:
    name: Detect toolbox changes
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      toolbox: ${{ steps.diff.outputs.toolbox }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        run: |
          built="$(sed -nE 's#.*/quote-toolbox:\$\{TOOLBOX_TAG:-([0-9a-f]{40})\}.*#\1#p' docker-compose.yml)"
          if [ -z "$built" ] || ! git merge-base --is-ancestor "$built" "$GITHUB_SHA" 2>/dev/null; then
            changed=true
          elif git diff --quiet "$built" "$GITHUB_SHA" -- toolbox/; then
            changed=false
          else
            changed=true
          fi
          echo "toolbox=$changed" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build, scan, push and sign quote-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, sast, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quote-api" | tee -a "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: type=sha,format=long,prefix=
          flavor: latest=false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 image for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64
          load: true
          provenance: false
          tags: quote-api:scan
          cache-from: type=gha,scope=quote-api
      - name: Trivy gate (fixable HIGH or CRITICAL fails the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quote-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.75.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 + arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=quote-api
          cache-to: type=gha,mode=max,scope=quote-api
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign by digest (keyless, GitHub OIDC)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  toolbox:
    name: Build, push and sign quote-toolbox
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.toolbox == 'true'
    needs: [changes, test, sast, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/quote-toolbox" | tee -a "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: type=sha,format=long,prefix=
          flavor: latest=false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build amd64 image for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: toolbox
          platforms: linux/amd64
          load: true
          provenance: false
          tags: quote-toolbox:scan
          cache-from: type=gha,scope=quote-toolbox
      - name: Trivy report (informational, the toolbox never runs in the cluster)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quote-toolbox:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          version: v0.75.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 + arm64
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: toolbox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=quote-toolbox
          cache-to: type=gha,mode=max,scope=quote-toolbox
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign by digest (keyless, GitHub OIDC)
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  deploy-bump:
    name: GitOps bump of the image tags
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.build.result == 'success'
      && (needs.toolbox.result == 'success' || needs.toolbox.result == 'skipped')
    needs: [build, toolbox]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      # Pushes made with GITHUB_TOKEN do not start workflow runs, so this commit cannot loop.
      # sed edits the line yq finds because "yq -i" would strip the blank lines in values.yaml.
      - name: Commit the new tags to main
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ github.sha }}
          VALUES: charts/quote-api/values.yaml
          COMPOSE: docker-compose.yml
          TOOLBOX_BUILT: ${{ needs.toolbox.result == 'success' }}
          TOOLBOX_IMAGE: ${{ needs.toolbox.outputs.image }}
        run: |
          set_value() {
            line="$(yq "$1 | line" "$VALUES")"
            if [ "$line" -lt 1 ]; then
              echo "::error::$1 not found in $VALUES"
              exit 1
            fi
            sed -i -E "${line}s|^([[:space:]]*${1##*.}:).*|\1 \"$2\"|" "$VALUES"
            [ "$(yq "$1" "$VALUES")" = "$2" ]
          }
          set_toolbox() {
            ref="${TOOLBOX_IMAGE}:\${TOOLBOX_TAG:-${TAG}}"
            sed -i -E 's#ghcr\.io/[^/]*/quote-toolbox:\$\{TOOLBOX_TAG:-[^}]*\}#'"$ref"'#' "$COMPOSE"
            if ! grep -qF "image: $ref" "$COMPOSE"; then
              echo "::error::toolbox image line not found in $COMPOSE"
              exit 1
            fi
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          msg="deploy: quote-api ${TAG}"
          if [ "$TOOLBOX_BUILT" = true ]; then
            msg="deploy: quote-api and quote-toolbox ${TAG}"
          fi
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            set_value .image.repository "$IMAGE"
            set_value .image.tag "$TAG"
            if [ "$TOOLBOX_BUILT" = true ]; then
              set_toolbox
            fi
            if git diff --quiet -- "$VALUES" "$COMPOSE"; then
              echo "main already points at ${TAG}"
              exit 0
            fi
            git diff -- "$VALUES" "$COMPOSE"
            git add -- "$VALUES" "$COMPOSE"
            git commit --quiet -m "$msg"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved during the bump, retrying (${attempt}/3)"
          done
          exit 1
