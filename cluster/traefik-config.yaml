# k3s ships Traefik as a single replica. Pin it to the server node so the
# ingress never sits on a spot node that the reclaim drill drains.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
