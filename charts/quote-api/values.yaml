image:
  repository: "ghcr.io/quaghug/quote-api"
  tag: "43b1c02ece18c2a4036452866cd15f755b9f659d"
  pullPolicy: IfNotPresent

# Ignored while autoscaling is enabled; the chart then omits spec.replicas.
replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  # 1 pod/min: a fast drop deletes from the busiest node (on-demand) first and can leave none there.
  scaleDownPodsPerMinute: 1
  scaleDownStabilizationSeconds: 60

workRounds: ""

resources:
  requests:
    cpu: 250m
    memory: 32Mi
  limits:
    cpu: "1"
    memory: 128Mi

placement:
  capacityLabel: acme.io/capacity
  allowedCapacities: [spot, on-demand]
  preferredCapacity: spot
  # 3 replicas cannot split 3-0, so one lands on on-demand; 2 rather than 1 keeps spot the majority at scale.
  poolMaxSkew: 2

pdb:
  maxUnavailable: 1

service:
  port: 80

ingress:
  enabled: true
  className: traefik
  path: /api

monitoring:
  serviceMonitor: true
  prometheusRule: true
  dashboard: true
  latencyAlert:
    p95Seconds: 1
    for: 3m
