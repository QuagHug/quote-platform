apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  role: KarpenterNodeRole-quote-prod
  amiSelectorTerms:
    - alias: al2023@v20261003
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: quote-prod
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: quote-prod
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      rootVolume: true
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        iops: 6000
        throughput: 500
        encrypted: true
        deleteOnTermination: true
  tags:
    app: quote-inference
    managed-by: karpenter
