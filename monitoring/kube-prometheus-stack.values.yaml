alertmanager:
  enabled: false  # rules still evaluate in Prometheus, there is just no paging
nodeExporter:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Select every ServiceMonitor and PrometheusRule, not only ones labeled release=kps.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 12h
    resources:
      requests:
        cpu: 100m
        memory: 400Mi

kube-state-metrics:
  metricLabelsAllowlist:
    - nodes=[acme.io/capacity]

grafana:
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    auth:
      disable_login_form: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
