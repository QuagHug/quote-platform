name: quote-platform

x-toolbox: &toolbox
  image: ghcr.io/quaghug/quote-toolbox:${TOOLBOX_TAG:-370784c8e128500fb6675c50ee1e0cdccf85df03}
  environment:
    IN_TOOLBOX: "1"
    KUBECONFIG: /kube/config
    CLUSTER_NAME: ${CLUSTER_NAME:-quote}
    INGRESS_PORT: ${INGRESS_PORT:-8080}
    API_PORT: ${API_PORT:-6550}
    GRAFANA_PORT: ${GRAFANA_PORT:-3000}
    ARGOCD_PORT: ${ARGOCD_PORT:-8081}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./:/workspace
    - kube:/kube
    - /var/run/docker.sock:/var/run/docker.sock

services:
  cluster:
    <<: *toolbox
    build: ./toolbox
    command: ["sh", "/workspace/scripts/00-bootstrap.sh"]
    restart: "no"

  toolbox:
    <<: *toolbox
    pull_policy: never   # same image the cluster service just pulled or built
    command: ["sleep", "infinity"]
    init: true
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:${ARGOCD_PORT:-8081}:8081"
    depends_on:
      cluster:
        condition: service_completed_successfully

volumes:
  kube: {}
